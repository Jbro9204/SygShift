version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Denver
    # Routine version churn stays off. Security updates remain available and
    # are grouped so reviewers receive one focused change instead of a flood.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security
    commit-message:
      prefix: security

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Denver
    # The scheduled release gate reports ordinary drift; Dependabot opens
    # grouped pull requests only for security updates enabled by the owner.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security
    commit-message:
      prefix: security
