name: Security and release checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: Dependency and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject high-severity production advisories
        run: pnpm audit --prod --audit-level high

      - name: Run the complete release gate
        run: pnpm check

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
